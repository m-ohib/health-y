name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  IMAGE: ghcr.io/m-ohib/health-y

jobs:
  backend:
    name: Backend (build + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore HealthY.sln

      - name: Build
        run: dotnet build HealthY.sln -c Release --no-restore

      - name: Test
        run: dotnet test HealthY.sln -c Release --no-build --verbosity normal

  frontend:
    name: Frontend (build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

  container:
    name: Container (build, push på main)
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log ind på GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Byg (og push på main)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy til Azure
    needs: [container]
    if: github.event_name == 'push' && vars.AZURE_CLIENT_ID != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Log ind i Azure (OIDC, ingen gemte nøgler)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Opdatér Container App
        run: |
          az containerapp update \
            --name ca-healthy \
            --resource-group rg-healthy \
            --image ${{ env.IMAGE }}:${{ github.sha }}

      - name: Røgtest af /health
        run: |
          url="https://$(az containerapp show -n ca-healthy -g rg-healthy --query properties.configuration.ingress.fqdn -o tsv)/health"
          for i in $(seq 1 12); do
            if curl -fsS "$url"; then echo; echo "OK: $url"; exit 0; fi
            echo "Venter på at appen vågner ($i/12)..."; sleep 10
          done
          echo "Appen svarede ikke på $url"; exit 1
